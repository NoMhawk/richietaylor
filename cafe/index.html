<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skydive Southwest Cafe Screen</title>
    
    <!-- Hard refresh the page every 3600 seconds (1 hour) -->
    <meta http-equiv="refresh" content="3600">
    
    <link rel="preconnect" href="https://fonts.googleapis.com/">
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@500;700&family=Amatic+SC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Strictly Viewport-bound Scaling for 16:9 1080p fit */
            --flap-w: 1.5vw;
            --flap-h: 3.2vh;
            --font-size: 2.2vh;
            --flap-gap: 0.15vw;
            --row-gap: 0.5vh;
            
            /* Board Colors */
            --bg-page: #050505;
            --board-bg: #111111;
            --flap-bg: #1c1c1c;
            --flap-border: #000;
            --text-item: #ffcc00;
            --text-header: #fff;
            
            /* Chalkboard Colors */
            --chalk-bg: #2a3132;
            --chalk-white: #f4f4f4;
            --espresso: #2e1503;
            --water: #a8d5e5;
            --milk: #fdf6e3;
            --foam: #fffef8;
            --choco: #4a2e1b;
            --tea: #c46210;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-page);
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
            margin: 0;
            overflow: hidden; /* Force absolutely no scrolling */
            font-family: 'Roboto Mono', monospace;
        }

        /* =========================================
           TOP SECTION: SPLIT FLAP BOARD
           ========================================= */
        .top-section {
            flex: 1 1 auto;
            padding: 2vh 2vw;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: radial-gradient(circle at top, #1a1a1a 0%, #050505 100%);
            min-height: 0; /* Prevents flex children from stretching the body container */
        }

        .board-wrapper {
            background-color: var(--board-bg);
            padding: 2vh 3vw 2.5vh;
            border-radius: 1vh;
            box-shadow: 0 2vh 4vh rgba(0,0,0,0.9), inset 0 0 2vh rgba(255,255,255,0.02);
            border: 0.4vh solid #222;
            max-height: 100%;
            display: flex;
            flex-direction: column;
        }

        .header-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1.5vw;
            margin-bottom: 2vh;
            flex-shrink: 0;
        }

        .header-logo {
            height: 8vh;
            border-radius: 0.5vh;
            box-shadow: 0 0.5vh 1vh rgba(0,0,0,0.5);
        }

        .board-frame {
            display: flex;
            gap: 3vw;
            flex: 1;
            justify-content: center;
        }

        .board-column {
            display: flex;
            flex-direction: column;
        }

        .board-row {
            display: flex;
            gap: var(--flap-gap);
            margin-bottom: var(--row-gap);
        }

        .flap {
            width: var(--flap-w);
            height: var(--flap-h);
            background-color: var(--flap-bg);
            color: var(--text-item);
            display: flex;
            justify-content: center;
            align-items: center;
            border: 0.1vh solid var(--flap-border);
            border-radius: 0.2vh;
            font-size: var(--font-size);
            font-weight: 700;
            line-height: 1;
            position: relative;
            box-shadow: 0 0.2vh 0.4vh rgba(0,0,0,0.6);
            user-select: none;
        }

        .flap::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 0.2vh;
            background-color: rgba(0,0,0,0.8);
            transform: translateY(-50%);
            z-index: 10;
        }

        .flap span {
            position: relative;
            z-index: 5;
        }

        .header-row .flap {
            color: var(--text-header);
        }

        .flap.flipping {
            color: #fff;
            filter: brightness(1.2);
        }

        /* =========================================
           BOTTOM SECTION: CHALKBOARD DIAGRAM
           ========================================= */
        .bottom-section {
            flex: 0 0 38vh; /* Exactly 38% of viewport height */
            background-color: var(--chalk-bg);
            background-image: 
                radial-gradient(circle, rgba(255,255,255,0.03) 0%, transparent 60%),
                url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http\://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
            border-top: 1vh solid #4a3f35;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-evenly;
            padding: 1vh 0;
            font-family: 'Amatic SC', cursive;
            box-sizing: border-box;
        }

        /* Chalk Ribbon */
        .ribbon-container {
            position: relative;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .chalk-ribbon {
            border: 0.3vh solid var(--chalk-white);
            padding: 0.5vh 4vw;
            font-size: 4vh;
            color: var(--chalk-white);
            font-weight: 700;
            letter-spacing: 0.2vw;
            position: relative;
            text-shadow: 0 0 0.5vh rgba(255,255,255,0.3);
            box-shadow: 0 0 0.8vh rgba(255,255,255,0.1), inset 0 0 0.8vh rgba(255,255,255,0.1);
        }

        .chalk-ribbon::before, .chalk-ribbon::after {
            content: "";
            position: absolute;
            top: 15%;
            height: 70%;
            width: 3vw;
            border: 0.3vh solid var(--chalk-white);
        }

        .chalk-ribbon::before {
            left: -3.5vw;
            border-right: none;
            clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%, 20% 50%);
        }

        .chalk-ribbon::after {
            right: -3.5vw;
            border-left: none;
            clip-path: polygon(0 0, 100% 0, 80% 50%, 100% 100%, 0 100%);
        }

        /* Cups Layout */
        .cups-container {
            display: flex;
            justify-content: center;
            gap: 3vw;
            width: 100%;
            padding: 0 2vw;
        }

        .cup-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .cup-glass-container {
            position: relative;
            margin-bottom: 0.5vh;
        }

        .cup-body {
            width: 8vh;
            height: 10vh;
            border: 0.3vh solid var(--chalk-white);
            border-top: none;
            border-radius: 0 0 2vh 2vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            overflow: hidden; /* Keeps liquid inside */
            position: relative;
            background: rgba(255,255,255,0.05); /* Slight glass reflection */
            z-index: 2;
        }

        .cup-handle {
            position: absolute;
            right: -2.2vh;
            top: 2vh;
            width: 2.5vh;
            height: 5vh;
            border: 0.3vh solid var(--chalk-white);
            border-left: none;
            border-radius: 0 2vh 2vh 0;
            z-index: 1;
        }

        .cup-name {
            color: var(--chalk-white);
            font-size: 2.5vh;
            font-weight: 700;
            letter-spacing: 0.1vw;
            text-shadow: 0 0 0.4vh rgba(255,255,255,0.3);
        }

        /* Liquid Layers */
        .layer {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.6vh;
            font-weight: 700;
            text-align: center;
            font-family: 'Amatic SC', cursive;
            letter-spacing: 0.05vw;
        }

        .espresso { background-color: var(--espresso); color: var(--milk); }
        .water { background-color: var(--water); color: var(--espresso); }
        .steamed-milk { background-color: var(--milk); color: var(--espresso); }
        .milk-foam { 
            background-color: var(--foam); 
            color: var(--espresso); 
            border-bottom: 0.2vh dashed rgba(0,0,0,0.1); 
        }
        .choco { background-color: var(--choco); color: var(--milk); }
        .tea-liquid { background-color: var(--tea); color: var(--milk); }

        /* Specific Cup Heights */
        /* Americano */
        .cup-americano .water { height: 75%; }
        .cup-americano .espresso { height: 25%; }
        
        /* Latte */
        .cup-latte .milk-foam { height: 15%; }
        .cup-latte .steamed-milk { height: 60%; }
        .cup-latte .espresso { height: 25%; }

        /* Cappuccino */
        .cup-cap .milk-foam { height: 40%; }
        .cup-cap .steamed-milk { height: 35%; }
        .cup-cap .espresso { height: 25%; }

        /* Mocha */
        .cup-mocha .steamed-milk { height: 20%; }
        .cup-mocha .choco { height: 55%; }
        .cup-mocha .espresso { height: 25%; }

        /* Flat White */
        .cup-flat .steamed-milk { height: 70%; }
        .cup-flat .espresso { height: 30%; }

        /* Tea (Full + Teabag) */
        .cup-tea .tea-liquid { height: 90%; }
        
        .tea-string {
            position: absolute;
            top: -1.5vh;
            right: 1.5vh;
            width: 0.2vh;
            height: 3vh;
            background-color: var(--chalk-white);
            z-index: 5;
            transform: rotate(15deg);
        }
        .tea-tag {
            position: absolute;
            top: 1.2vh;
            right: -0.5vh;
            background-color: var(--chalk-white);
            color: var(--chalk-bg);
            padding: 0.1vh 0.4vw;
            font-size: 1.2vh;
            font-family: 'Roboto Mono', monospace;
            border-radius: 0.2vh;
            z-index: 6;
            transform: rotate(15deg);
        }

        /* =========================================
           PORTRAIT / MOBILE RESPONSIVE OVERRIDES
           ========================================= */
        @media (max-aspect-ratio: 1/1), (max-width: 768px) {
            :root {
                --flap-w: 3.6vw;
                --flap-h: 6vw;
                --font-size: 4vw;
                --flap-gap: 0.4vw;
                --row-gap: 1vw;
            }
            
            body {
                height: auto;
                min-height: 100vh;
                overflow-y: auto; /* Allow scrolling on portrait */
                overflow-x: hidden;
            }

            .top-section {
                padding: 4vw 2vw;
            }

            .header-logo {
                height: 12vw;
            }

            .board-wrapper {
                padding: 4vw;
                border-width: 0.8vw;
            }

            .board-frame {
                flex-direction: column; /* Stack columns */
                gap: 6vw;
            }

            .bottom-section {
                flex: none;
                height: auto;
                padding: 8vw 0;
            }

            .ribbon-container {
                margin-bottom: 6vw;
            }

            .chalk-ribbon {
                font-size: 6vw;
                padding: 1vw 6vw;
                border-width: 0.6vw;
            }

            .chalk-ribbon::before, .chalk-ribbon::after {
                border-width: 0.6vw;
            }

            .cups-container {
                display: grid;
                grid-template-columns: repeat(2, 1fr); /* 2-column grid for cups */
                gap: 8vw 4vw;
            }

            .cup-body {
                width: 18vw;
                height: 22vw;
                border-width: 0.6vw;
                border-radius: 0 0 4vw 4vw;
            }

            .cup-handle {
                right: -4vw;
                top: 4vw;
                width: 5vw;
                height: 10vw;
                border-width: 0.6vw;
                border-radius: 0 4vw 4vw 0;
            }

            .cup-name {
                font-size: 4.5vw;
                margin-top: 2vw;
            }

            .layer {
                font-size: 3vw;
            }

            .tea-string {
                top: -3vw;
                right: 3vw;
                width: 0.4vw;
                height: 6vw;
            }

            .tea-tag {
                top: 2vw;
                right: -2vw;
                font-size: 2.5vw;
            }
        }

    </style>
</head>
<body>

    <!-- TOP SECTION: BOARD -->
    <div class="top-section">
        <div class="board-wrapper">
            <div class="header-container">
                <img src="https://www.skydivesouthwest.com/logo.jpg" alt="Skydive Southwest Logo" class="header-logo">
            </div>
            <div class="board-frame">
                <div id="col-left" class="board-column"></div>
                <div id="col-right" class="board-column"></div>
            </div>
        </div>
    </div>

    <!-- BOTTOM SECTION: CHALKBOARD -->
    <div class="bottom-section">
        
        <div class="ribbon-container">
            <div class="chalk-ribbon">THE MANIFEST OF COFFEE</div>
        </div>

        <div class="cups-container">
            <!-- 1. Americano -->
            <div class="cup-wrapper">
                <div class="cup-glass-container">
                    <div class="cup-handle"></div>
                    <div class="cup-body cup-americano">
                        <div class="layer water">HOT WATER</div>
                        <div class="layer espresso">ESPRESSO</div>
                    </div>
                </div>
                <div class="cup-name">AMERICANO</div>
            </div>

            <!-- 2. Latte -->
            <div class="cup-wrapper">
                <div class="cup-glass-container">
                    <div class="cup-handle"></div>
                    <div class="cup-body cup-latte">
                        <div class="layer milk-foam">MILK FOAM</div>
                        <div class="layer steamed-milk">STEAMED MILK</div>
                        <div class="layer espresso">ESPRESSO</div>
                    </div>
                </div>
                <div class="cup-name">LATTE</div>
            </div>

            <!-- 3. Cappuccino -->
            <div class="cup-wrapper">
                <div class="cup-glass-container">
                    <div class="cup-handle"></div>
                    <div class="cup-body cup-cap">
                        <div class="layer milk-foam">MILK FOAM</div>
                        <div class="layer steamed-milk">STEAMED MILK</div>
                        <div class="layer espresso">ESPRESSO</div>
                    </div>
                </div>
                <div class="cup-name">CAPPUCCINO</div>
            </div>

            <!-- 4. Mocha -->
            <div class="cup-wrapper">
                <div class="cup-glass-container">
                    <div class="cup-handle"></div>
                    <div class="cup-body cup-mocha">
                        <div class="layer steamed-milk">MILK</div>
                        <div class="layer choco">HOT CHOCOLATE</div>
                        <div class="layer espresso">ESPRESSO</div>
                    </div>
                </div>
                <div class="cup-name">MOCHA</div>
            </div>

            <!-- 5. Flat White -->
            <div class="cup-wrapper">
                <div class="cup-glass-container">
                    <div class="cup-handle"></div>
                    <div class="cup-body cup-flat">
                        <div class="layer steamed-milk">STEAMED MILK</div>
                        <div class="layer espresso">ESPRESSO</div>
                    </div>
                </div>
                <div class="cup-name">FLAT WHITE</div>
            </div>

            <!-- 6. Tea -->
            <div class="cup-wrapper">
                <div class="cup-glass-container">
                    <div class="cup-handle"></div>
                    <div class="tea-string"></div>
                    <div class="tea-tag">TEA</div>
                    <div class="cup-body cup-tea">
                        <div class="layer tea-liquid">HOT TEA</div>
                    </div>
                </div>
                <div class="cup-name">TEA</div>
            </div>
        </div>

    </div>

    <!-- SCRIPT FOR BOARD ANIMATION -->
    <script>
        const ROW_LENGTH = 24; 
        const CHARS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789£. &';

        // Balancing the menu data into two columns perfectly 
        const menuDataLeft = [
            { title: "COFFEE", items: [
                { name: "AMERICANO", price: "£2.95" },
                { name: "LATTE", price: "£3.50" },
                { name: "CAPPUCCINO", price: "£3.50" },
                { name: "MOCHA", price: "£3.50" },
                { name: "FLAT WHITE", price: "£3.50" },
                { name: "TEA", price: "£2.20" }
            ]},
            { title: "ICED COFFEE", items: [
                { name: "ICED LATTE", price: "£3.75" },
                { name: "VANILLA ICED", price: "£3.95" },
                { name: "CARAMEL ICED", price: "£3.95" }
            ]}
        ];

        const menuDataRight = [
            { title: "COLD DRINKS", items: [
                { name: "CANS", price: "£1.80" },
                { name: "BOTTLES", price: "£2.50" },
                { name: "WATER", price: "£1.50" },
                { name: "ENERGY DRINKS", price: "£2.80" },
                { name: "KIDS DRINKS", price: "£1.50" }
            ]},
            { title: "FOOD", items: [
                { name: "CRISPS", price: "£1.40" },
                { name: "CHOCOLATE BARS", price: "£1.30" },
                { name: "FRUIT", price: "90P" },
                { name: "ICE CREAM", price: "£3.00" },
                { name: "ICE LOLLY", price: "£2.00" }
            ]}
        ];

        function renderBoard() {
            const leftCol = document.getElementById('col-left');
            const rightCol = document.getElementById('col-right');
            leftCol.replaceChildren();
            rightCol.replaceChildren();
            buildColumn(leftCol, menuDataLeft);
            buildColumn(rightCol, menuDataRight);
            animateBoard();
        }

        function buildColumn(container, dataChunks) {
            let rowIndex = 0;
            dataChunks.forEach((chunk, chunkIndex) => {
                const headerStr = chunk.title.padEnd(ROW_LENGTH, ' ');
                container.appendChild(createRow(headerStr, true));

                chunk.items.forEach(item => {
                    const name = item.name.toUpperCase();
                    const price = item.price.toUpperCase();
                    const spacesNeeded = ROW_LENGTH - name.length - price.length;
                    const itemStr = name + ' '.repeat(Math.max(0, spacesNeeded)) + price;
                    container.appendChild(createRow(itemStr, false));
                    rowIndex++;
                });

                if (chunkIndex < dataChunks.length - 1) {
                    container.appendChild(createRow(' '.repeat(ROW_LENGTH), false));
                    rowIndex++;
                }
                rowIndex++;
            });
        }

        function createRow(str, isHeader) {
            const rowDiv = document.createElement('div');
            rowDiv.className = 'board-row';
            if (isHeader) rowDiv.classList.add('header-row');

            const safeStr = str.substring(0, ROW_LENGTH).padEnd(ROW_LENGTH, ' ');
            const fragment = document.createDocumentFragment();

            for (let i = 0; i < safeStr.length; i++) {
                const flap = document.createElement('div');
                flap.className = 'flap';
                flap.dataset.target = safeStr[i].toUpperCase();
                const charSpan = document.createElement('span');
                charSpan.textContent = ' ';
                flap.appendChild(charSpan);
                fragment.appendChild(flap);
            }
            rowDiv.appendChild(fragment);
            return rowDiv;
        }

        // Animate existing cells instead of rebuilding the whole DOM every 30 seconds.
        function animateBoard() {
            const flaps = document.querySelectorAll('.flap');
            flaps.forEach((flap, index) => {
                const row = Math.floor(index / ROW_LENGTH);
                const column = index % ROW_LENGTH;
                const delay = (row * 18) + (column * 5);
                animateFlap(flap, flap.firstElementChild, flap.dataset.target, delay);
            });
        }

        function animateFlap(flap, charSpan, targetChar, delay) {
            if (targetChar === ' ') {
                charSpan.textContent = ' ';
                return;
            }

            window.setTimeout(() => {
                // Fewer flips and a slightly slower cadence reduce CPU/GPU load on the Pi.
                const flips = 4 + Math.floor(Math.random() * 4); // 4–7 flips
                const targetIndex = CHARS.indexOf(targetChar);
                if (targetIndex === -1) {
                    charSpan.textContent = targetChar;
                    return;
                }

                let currentIdx = (targetIndex - flips + CHARS.length) % CHARS.length;
                flap.classList.add('flipping');
                let completed = 0;

                const interval = window.setInterval(() => {
                    charSpan.textContent = CHARS[currentIdx];
                    currentIdx = (currentIdx + 1) % CHARS.length;
                    completed++;

                    if (completed >= flips) {
                        window.clearInterval(interval);
                        charSpan.textContent = targetChar;
                        flap.classList.remove('flipping');
                    }
                }, 55);
            }, delay);
        }

        window.addEventListener('DOMContentLoaded', () => {
            renderBoard();
            // Refresh mechanical board every 30 seconds
            window.setInterval(animateBoard, 30000); 
        });
    </script>
</body>
