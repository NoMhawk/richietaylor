    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        :root {
            --bg-primary: #020617;

            --accent-amber: #f59e0b;

            --accent-red: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-primary); color: var(--text-main); min-height: 100vh; line-height: 1.5; }

        header { background-color: var(--bg-card); border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 50; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .header-container { max-width: 1400px; margin: 0 auto; padding: 1rem 1.5rem; display: flex; flex-direction: column; gap: 1rem; align-items: center; justify-content: space-between; }
        @media(min-width: 640px) { .header-container { flex-direction: row; } }

        .logo-box { display: flex; align-items: center; gap: 0.75rem; }
        .logo-icon { background-color: var(--accent-sky); color: white; padding: 0.6rem; border-radius: 0.75rem; display: flex; align-items: center; justify-content: center; font-size: 1.25rem; }
        .logo-title { font-size: 1.125rem; font-weight: 700; letter-spacing: -0.025em; display: flex; align-items: center; gap: 0.5rem; }
        .rev-badge { font-size: 0.65rem; background: rgba(14, 165, 233, 0.2); color: #38bdf8; border: 1px solid rgba(14, 165, 233, 0.4); padding: 0.1rem 0.4rem; border-radius: 0.25rem; font-weight: 600; }
        .logo-sub { font-size: 0.75rem; color: var(--text-muted); }

        .header-actions { display: flex; align-items: center; gap: 1rem; }
        .last-updated { font-size: 0.75rem; color: var(--text-muted); background-color: var(--bg-primary); padding: 0.375rem 0.75rem; border-radius: 0.5rem; border: 1px solid var(--border-color); display: flex; align-items: center; gap: 0.35rem; }
        .btn-refresh { background-color: var(--accent-sky); color: white; border: none; font-size: 0.75rem; font-weight: 600; padding: 0.5rem 0.875rem; border-radius: 0.5rem; cursor: pointer; transition: background 0.2s; display: flex; align-items: center; gap: 0.375rem; }
        .btn-refresh:hover { background-color: #0284c7; }

        main { max-width: 1400px; margin: 0 auto; padding: 1.5rem; display: flex; flex-direction: column; gap: 2rem; }

        .error-banner { background-color: rgba(127, 29, 29, 0.8); border: 1px solid #b91c1c; color: #fecaca; padding: 0.85rem 1.25rem; border-radius: 0.75rem; font-size: 0.875rem; display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; margin-bottom: 1rem; }
        .hidden { display: none !important; }

        /* 7-Day Top Selector */
        .selector-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.75rem; }
        @media(min-width: 640px) { .selector-grid { grid-template-columns: repeat(4, 1fr); } }
        @media(min-width: 1024px) { .selector-grid { grid-template-columns: repeat(7, 1fr); } }

        .day-tab { background-color: var(--bg-card); border: 2px solid var(--border-color); border-radius: 0.85rem; padding: 0.85rem; text-align: center; cursor: pointer; transition: all 0.2s; display: flex; flex-direction: column; gap: 0.4rem; }
        .day-tab:hover { border-color: var(--accent-sky); }
        .day-tab.active { background-color: rgba(14, 165, 233, 0.15); border-color: var(--accent-sky); box-shadow: 0 0 15px rgba(14, 165, 233, 0.2); }

        section { display: flex; flex-direction: column; gap: 1.5rem; }
        .section-header { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-color); padding-bottom: 0.75rem; }
        .section-title-wrap { display: flex; align-items: center; gap: 0.625rem; }
        .section-dot { width: 0.75rem; height: 0.75rem; border-radius: 9999px; background-color: var(--accent-sky); box-shadow: 0 0 10px var(--accent-sky); }
        .section-title { font-size: 1.15rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
        .section-date { font-size: 0.75rem; color: var(--text-muted); font-weight: 500; }

        @media(min-width: 768px) { .cards-grid-4 { grid-template-columns: repeat(4, 1fr); } }

        .card { background-color: var(--bg-card); border: 1px solid var(--border-color); border-radius: 1rem; padding: 1.25rem; display: flex; flex-direction: column; justify-content: space-between; }

        .card-value { font-size: 1.875rem; font-weight: 800; margin-top: 0.25rem; }
        .card-desc { font-size: 0.75rem; color: var(--text-muted); margin-top: 0.5rem; display: flex; align-items: center; gap: 0.35rem; }

        .panel { background-color: var(--bg-card); border: 1px solid var(--border-color); border-radius: 1rem; padding: 1.5rem; display: flex; flex-direction: column; gap: 1.25rem; }
        .panel-header { display: flex; justify-content: space-between; align-items: center; }

        .badge { font-size: 0.7rem; background-color: var(--bg-primary); color: #cbd5e1; padding: 0.25rem 0.625rem; border-radius: 0.375rem; border: 1px solid var(--border-color); font-weight: 500; }

        .table-responsive { width: 100%; overflow-x: auto; }

        th { background-color: rgba(30, 41, 59, 0.6); color: var(--text-muted); text-transform: uppercase; font-weight: 600; padding: 0.85rem; }
        td { padding: 0.85rem; border-top: 1px solid var(--border-color); color: #e2e8f0; }

        /* Threshold Color Utilities */
        .text-green { color: #34d399 !important; }

        .text-orange { color: #fb923c !important; }
        .text-red { color: #f87171 !important; }

        /* 4-Tier Condition Status Pill Classes */
        .status-green { background-color: rgba(6, 78, 59, 0.7); color: #6ee7b7; border: 1px solid rgba(5, 150, 105, 0.5); padding: 0.2rem 0.4rem; border-radius: 0.3rem; font-weight: 700; text-align: center; font-size: 0.65rem; display: block; text-transform: uppercase; }
        .status-yellow { background-color: rgba(113, 63, 18, 0.7); color: #fde047; border: 1px solid rgba(202, 138, 4, 0.5); padding: 0.2rem 0.4rem; border-radius: 0.3rem; font-weight: 700; text-align: center; font-size: 0.65rem; display: block; text-transform: uppercase; }
        .status-orange { background-color: rgba(124, 45, 18, 0.7); color: #fdba74; border: 1px solid rgba(234, 88, 12, 0.5); padding: 0.2rem 0.4rem; border-radius: 0.3rem; font-weight: 700; text-align: center; font-size: 0.65rem; display: block; text-transform: uppercase; }
        .status-red { background-color: rgba(127, 29, 29, 0.7); color: #fca5a5; border: 1px solid rgba(220, 38, 38, 0.5); padding: 0.2rem 0.4rem; border-radius: 0.3rem; font-weight: 700; text-align: center; font-size: 0.65rem; display: block; text-transform: uppercase; }

        .grid-2 { display: grid; grid-template-columns: 1fr; gap: 1.5rem; }
        @media(min-width: 1024px) { .grid-2 { grid-template-columns: repeat(2, 1fr); } }

        .ladder-row { background-color: rgba(30, 41, 59, 0.5); padding: 0.85rem; border-radius: 0.75rem; border: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem; }
        .ladder-alt { font-weight: 700; color: white; display: block; }
        .ladder-sub { color: var(--text-muted); font-size: 0.75rem; }
        .ladder-val { text-align: right; }

        /* Hourly Grid Layout */
        .hourly-grid { display: grid; grid-template-columns: 1fr; gap: 1rem; }
        @media(min-width: 768px) { .hourly-grid { grid-template-columns: repeat(2, 1fr); } }
        @media(min-width: 1200px) { .hourly-grid { grid-template-columns: repeat(3, 1fr); } }
        @media(min-width: 1600px) { .hourly-grid { grid-template-columns: repeat(4, 1fr); } }

        .hour-card { background-color: rgba(30, 41, 59, 0.45); border: 1px solid var(--border-color); border-radius: 1rem; padding: 1.15rem; display: flex; flex-direction: column; justify-content: space-between; font-size: 0.8rem; gap: 0.75rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.2); transition: all 0.2s; }
        .hour-card.current-hour { background-color: rgba(14, 165, 233, 0.12); border: 2px solid var(--accent-sky); box-shadow: 0 0 25px rgba(14, 165, 233, 0.35); }

        .hour-section { background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(51, 65, 85, 0.5); border-radius: 0.5rem; padding: 0.5rem 0.75rem; display: flex; flex-direction: column; gap: 0.25rem; }
        .hour-section-title { font-size: 0.7rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 1px solid rgba(51, 65, 85, 0.4); padding-bottom: 0.2rem; margin-bottom: 0.1rem; display: flex; justify-content: space-between; }

        .status-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.4rem; text-align: center; }
        .status-box { background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(51, 65, 85, 0.6); border-radius: 0.4rem; padding: 0.35rem 0.2rem; display: flex; flex-direction: column; gap: 0.2rem; }
        .status-title { font-size: 0.6rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; }

        /* Satellite / Radar Embed Frame */
        .map-container { position: relative; width: 100%; height: 450px; border-radius: 0.75rem; overflow: hidden; border: 1px solid var(--border-color); background: #000; }
        .map-container iframe { width: 100%; height: 100%; border: none; }
