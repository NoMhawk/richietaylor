name: Update Dinkspace Schedule

on:
  schedule:
    - cron: '0 6 * * *' # Runs daily at 6:00 AM UTC
  workflow_dispatch: # Enables the manual "Run workflow" button

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run Scraper Script
        run: python .github/scripts/scrape_dinkspace.py

      - name: Auto-commit if events.json changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Auto-update Dinkspace event calendar data'
          file_pattern: 'dinkspace/events.json'
