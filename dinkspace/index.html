<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dinkspace Event Calendar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen">

    <div class="max-w-6xl mx-auto px-4 py-8">
        <!-- Header -->
        <header class="flex flex-col md:flex-row md:items-center md:justify-between mb-8 border-b border-slate-800 pb-6">
            <div>
                <h1 class="text-3xl font-black tracking-tight text-emerald-400 flex items-center gap-3">
                    <i class="fa-solid fa-calendar-days"></i> Dinkspace Calendar
                </h1>
                <p class="text-slate-400 mt-1">Festivals, Tournaments, Coaching Breaks & Clinics</p>
            </div>
            
            <!-- Filters -->
            <div class="mt-4 md:mt-0 flex flex-wrap gap-2">
                <button onclick="filterEvents('all')" id="btn-all" class="px-4 py-2 text-sm font-semibold rounded-lg bg-emerald-500 text-slate-950 transition">All Events</button>
                <button onclick="filterEvents('Festival')" id="btn-Festival" class="px-4 py-2 text-sm font-semibold rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 transition">Festivals</button>
                <button onclick="filterEvents('Coaching')" id="btn-Coaching" class="px-4 py-2 text-sm font-semibold rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 transition">Coaching</button>
                <button onclick="filterEvents('Tournament')" id="btn-Tournament" class="px-4 py-2 text-sm font-semibold rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 transition">Tournaments</button>
                <button onclick="filterEvents('Training')" id="btn-Training" class="px-4 py-2 text-sm font-semibold rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 transition">Training</button>
            </div>
        </header>

        <!-- Main Grid -->
        <div id="event-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Dynamically Populated -->
        </div>
    </div>

    <!-- Script Data & Logic -->
    <script>
        const events = [
            { title: "Manor House Coaching Break", date: "Nov 30 - Dec 4, 2026", type: "Coaching", location: "Manor House", desc: "Multi-day intensive coaching holiday break." },
            { title: "London Christmas Festival", date: "Dec 20, 2026", type: "Festival", location: "London", desc: "Festive social tournament and celebration event." },
            { title: "Southampton Christmas Festival", date: "Dec 20, 2026", type: "Festival", location: "Southampton", desc: "Festive social tournament and celebration event." },
            { title: "Taunton Christmas Festival", date: "Dec 27, 2026", type: "Festival", location: "Taunton", desc: "Post-Christmas celebration festival event." },
            { title: "Basingstoke November Festival", date: "Nov 7, 2026", type: "Festival", location: "Hampshire Court Hotel", desc: "15 acrylic courts festival event." },
            { title: "Exeter Coaching Clinic", date: "Nov 7, 2026", type: "Coaching", location: "Exeter", desc: "Targeted skill sessions and strategy clinics." },
            { title: "Basingstoke Improver Coaching Clinic", date: "Nov 8, 2026", type: "Coaching", location: "Basingstoke", desc: "Improver level tactical drills and court positioning." },
            { title: "Abingdon Festival", date: "Nov 15, 2026", type: "Festival", location: "Abingdon", desc: "Open community festival format." },
            { title: "Somerset County Team Training", date: "Nov 21, 2026", type: "Training", location: "Somerset", desc: "Squad training and match practice." },
            { title: "Courtside Coaching Clinics", date: "Nov 24, 2026", type: "Coaching", location: "Stourbridge", desc: "Specialist clinics hosted at Courtside." },
            { title: "Exeter Coaching Clinic", date: "Nov 28, 2026", type: "Coaching", location: "Exeter", desc: "Advanced and intermediate breakdown sessions." },
            { title: "Swindon Open", date: "Oct 24-25, 2026", type: "Tournament", location: "Swindon", desc: "Competitive tournament brackets across categories." }
        ];

        function renderEvents(filter = 'all') {
            const grid = document.getElementById('event-grid');
            grid.innerHTML = '';

            const filtered = filter === 'all' ? events : events.filter(e => e.type === filter);

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-500">No events found for this filter.</div>`;
                return;
            }

            filtered.forEach(ev => {
                let badgeColor = 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20';
                if (ev.type === 'Festival') badgeColor = 'bg-purple-500/10 text-purple-400 border-purple-500/20';
                if (ev.type === 'Tournament') badgeColor = 'bg-amber-500/10 text-amber-400 border-amber-500/20';
                if (ev.type === 'Training') badgeColor = 'bg-sky-500/10 text-sky-400 border-sky-500/20';

                const card = document.createElement('div');
                card.className = "bg-slate-800/60 border border-slate-700/60 rounded-xl p-5 flex flex-col justify-between hover:border-slate-600 transition shadow-lg";
                card.innerHTML = `
                    <div>
                        <div class="flex items-center justify-between gap-2 mb-3">
                            <span class="text-xs font-bold px-2.5 py-1 rounded-full border ${badgeColor}">${ev.type}</span>
                            <span class="text-xs text-slate-400 flex items-center gap-1"><i class="fa-regular fa-calendar"></i> ${ev.date}</span>
                        </div>
                        <h3 class="text-lg font-bold text-slate-100 mb-1">${ev.title}</h3>
                        <p class="text-sm text-slate-400 mb-4 flex items-center gap-1.5"><i class="fa-solid fa-location-dot text-rose-400"></i> ${ev.location}</p>
                        <p class="text-sm text-slate-300 leading-relaxed">${ev.desc}</p>
                    </div>
                    <div class="mt-6 pt-4 border-t border-slate-700/50 flex justify-between items-center">
                        <span class="text-xs text-emerald-400 font-medium">Dinkspace Schedule</span>
                        <a href="https://dinkspace.co.uk/dinkspace-schedule" target="_blank" class="text-xs bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded-md font-medium transition text-slate-200">View Site</a>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterEvents(type) {
            // Update active states on buttons
            ['all', 'Festival', 'Coaching', 'Tournament', 'Training'].forEach(t => {
                const btn = document.getElementById(`btn-${t}`);
                if (t === type) {
                    btn.className = "px-4 py-2 text-sm font-semibold rounded-lg bg-emerald-500 text-slate-950 transition shadow";
                } else {
                    btn.className = "px-4 py-2 text-sm font-semibold rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 transition";
                }
            });
            renderEvents(type);
        }

        // Initial render
        renderEvents();
    </script>
</body>
</html>
