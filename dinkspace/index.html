<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dinkspace Schedule</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#0f172a] text-slate-100 font-sans min-h-screen">

    <div class="max-w-4xl mx-auto px-4 py-10">
        
        <!-- Header -->
        <header class="flex flex-col md:flex-row md:items-center md:justify-between mb-8 bg-[#1e293b] p-6 rounded-2xl border border-slate-800 shadow-xl">
            <div class="flex items-center gap-4 mb-4 md:mb-0">
                <div class="bg-emerald-500 text-slate-950 p-3.5 rounded-xl font-black text-xl flex items-center justify-center shadow-lg shadow-emerald-500/20">
                    <i class="fa-solid fa-calendar-days"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-black tracking-tight text-white">Dinkspace Schedule</h1>
                    <p class="text-xs text-emerald-400 font-medium tracking-wide uppercase mt-0.5">Upcoming Festivals, Coaching & Tournaments</p>
                </div>
            </div>

            <!-- Filters -->
            <div class="flex flex-wrap gap-2">
                <button onclick="filterEvents('all')" id="btn-all" class="px-3.5 py-2 text-xs font-bold rounded-lg bg-emerald-500 text-slate-950 transition shadow">All</button>
                <button onclick="filterEvents('Festival')" id="btn-Festival" class="px-3.5 py-2 text-xs font-bold rounded-lg bg-slate-900 text-slate-300 hover:bg-slate-800 border border-slate-700 transition">Festivals</button>
                <button onclick="filterEvents('Coaching')" id="btn-Coaching" class="px-3.5 py-2 text-xs font-bold rounded-lg bg-slate-900 text-slate-300 hover:bg-slate-800 border border-slate-700 transition">Coaching</button>
                <button onclick="filterEvents('Training')" id="btn-Training" class="px-3.5 py-2 text-xs font-bold rounded-lg bg-slate-900 text-slate-300 hover:bg-slate-800 border border-slate-700 transition">Training</button>
            </div>
        </header>

        <!-- Grouped Agenda Container -->
        <div id="agenda-container" class="space-y-8">
            <div class="text-center py-12 text-slate-500">Loading schedule...</div>
        </div>
    </div>

    <script>
        let allEvents = [];

        async function loadEvents() {
            try {
                const response = await fetch('./events.json');
                allEvents = await response.json();
                renderAgenda('all');
            } catch (error) {
                console.error("Error loading events.json:", error);
                document.getElementById('agenda-container').innerHTML = `
                    <div class="bg-slate-900 border border-rose-500/30 p-6 rounded-xl text-center text-rose-400 text-sm">
                        Could not load event data. Please verify events.json exists.
                    </div>`;
            }
        }

        function filterEvents(type) {
            ['all', 'Festival', 'Coaching', 'Training'].forEach(t => {
                const btn = document.getElementById(`btn-${t}`);
                if (t === type) {
                    btn.className = "px-3.5 py-2 text-xs font-bold rounded-lg bg-emerald-500 text-slate-950 transition shadow";
                } else {
                    btn.className = "px-3.5 py-2 text-xs font-bold rounded-lg bg-slate-900 text-slate-300 hover:bg-slate-800 border border-slate-700 transition";
                }
            });
            renderAgenda(type);
        }

        function renderAgenda(filter) {
            const container = document.getElementById('agenda-container');
            container.innerHTML = '';

            const filtered = filter === 'all' ? allEvents : allEvents.filter(e => e.type === filter);

            if (filtered.length === 0) {
                container.innerHTML = `<div class="text-center py-12 text-slate-500 bg-[#1e293b] rounded-2xl border border-slate-800">No events found for this category.</div>`;
                return;
            }

            // Group by Month/Year header
            const groupedByMonth = {};
            filtered.forEach(ev => {
                const d = new Date(ev.date);
                const monthKey = d.toLocaleString('en-GB', { month: 'long', year: 'numeric' });
                if (!groupedByMonth[monthKey]) groupedByMonth[monthKey] = [];
                groupedByMonth[monthKey].push(ev);
            });

            for (const [month, monthEvents] of Object.entries(groupedByMonth)) {
                const section = document.createElement('div');
                section.className = "space-y-4";
                
                const heading = document.createElement('div');
                heading.className = "flex items-center gap-3 pb-2 border-b border-slate-800";
                heading.innerHTML = `<h2 class="text-sm font-black tracking-wider uppercase text-emerald-400">${month}</h2><span class="text-xs text-slate-500 font-semibold">(${monthEvents.length} event${monthEvents.length > 1 ? 's' : ''})</span>`;
                section.appendChild(heading);

                const cardsList = document.createElement('div');
                cardsList.className = "space-y-3";

                monthEvents.forEach(ev => {


                    // Default / Coaching styling (Emerald)
                    let badgeStyle = 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30';
                    let cardBg = 'bg-[#1e293b]/90 border-slate-800 hover:border-emerald-500/50';
                    let dateColor = 'text-emerald-400';
                    let btnStyle = 'bg-slate-900 hover:bg-slate-800 text-slate-200 border-slate-700';

                    if (ev.type === 'Festival') {
                        badgeStyle = 'bg-purple-500/10 text-purple-400 border-purple-500/30';
                        cardBg = 'bg-[#1e1b2e]/90 border-purple-900/40 hover:border-purple-500/50';
                        dateColor = 'text-purple-400';
                        btnStyle = 'bg-purple-950/40 hover:bg-purple-900/50 text-purple-200 border-purple-800/60';
                    } else if (ev.type === 'Tournament') {
                        badgeStyle = 'bg-amber-500/10 text-amber-400 border-amber-500/30';
                        cardBg = 'bg-[#261f1a]/90 border-amber-900/40 hover:border-amber-500/50';
                        dateColor = 'text-amber-400';
                        btnStyle = 'bg-amber-950/40 hover:bg-amber-900/50 text-amber-200 border-amber-800/60';
                    } else if (ev.type === 'Training') {
                        badgeStyle = 'bg-sky-500/10 text-sky-400 border-sky-500/30';
                        cardBg = 'bg-[#172033]/90 border-sky-900/40 hover:border-sky-500/50';
                        dateColor = 'text-sky-400';
                        btnStyle = 'bg-sky-950/40 hover:bg-sky-900/50 text-sky-200 border-sky-800/60';
                    } else if (ev.type === 'Coaching') {
                        badgeStyle = 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30';
                        cardBg = 'bg-[#172622]/90 border-emerald-900/40 hover:border-emerald-500/50';
                        dateColor = 'text-emerald-400';
                        btnStyle = 'bg-emerald-950/40 hover:bg-emerald-900/50 text-emerald-200 border-emerald-800/60';
                    }

                    let formattedDate = ev.date;
                    try {
                        const d = new Date(ev.date);
                        formattedDate = d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
                    } catch(e) {}

                    const card = document.createElement('div');
                    card.className = `border rounded-2xl p-6 flex flex-col md:flex-row md:items-center justify-between gap-4 transition shadow-lg ${cardBg}`;
                    card.innerHTML = `
                        <div class="space-y-1.5">
                            <div class="flex items-center gap-3">
                                <span class="text-[11px] font-bold px-2.5 py-0.5 rounded-full border ${badgeStyle}">${ev.type}</span>
                                <span class="text-xs ${dateColor} font-medium flex items-center gap-1.5">
                                    <i class="fa-regular fa-calendar"></i> ${formattedDate}
                                </span>
                            </div>
                            <h3 class="text-lg font-bold text-white">${ev.title}</h3>
                            <p class="text-sm text-slate-400 flex items-center gap-1.5">
                                <i class="fa-solid fa-location-dot text-rose-400"></i> ${ev.location}
                            </p>
                            <p class="text-sm text-slate-300 pt-1">${ev.desc}</p>
                        </div>
                        <div class="flex md:flex-col items-end justify-between md:justify-center border-t md:border-t-0 pt-3 md:pt-0 border-slate-800/60">
                            <a href="${ev.url}" target="_blank" class="border text-xs font-semibold px-4 py-2 rounded-xl transition flex items-center gap-2 ${btnStyle}">
                                <span>View Event</span> <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
                            </a>
                        </div>
                    `;
                    cardsList.appendChild(card);
                });

                section.appendChild(cardsList);
                container.appendChild(section);
            }
        }

        loadEvents();
    </script>
</body>
</html>
